[project]
name = "refusal-circuit-dpo"
version = "0.1.0"
description = "Mechanistic analysis of DPO-induced refusal behavior"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "numpy>=2.5.1",
    "peft>=0.20.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "transformer-lens>=3.6.0",
    "transformers>=5.14.1",
    "trl>=1.9.2",
    "wandb>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rcdpo"]

[tool.uv]
package = true
